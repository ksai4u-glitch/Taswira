# Runs Claude for one stage of an agent task (called by agent-task.yml).
# Read-only GitHub token: Claude cannot push, comment or open pull requests.
# Its file changes leave this job only as a patch artifact, which
# agent-publish.yml checks before committing anything.

name: Agent stage (Claude)

on:
  workflow_call:
    inputs:
      stage: { type: string, required: true }          # work | response
      round: { type: number, required: true }
      edits_allowed: { type: boolean, required: true }
      sha: { type: string, required: true }
      mode: { type: string, required: true }           # review | implement
      issue: { type: number, required: true }
      task_dir: { type: string, required: true }
      branch: { type: string, required: true }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: false }
      ANTHROPIC_API_KEY: { required: false }

permissions: {}

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.stage == 'work' && 40 || 30 }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      # Strip Anthropic, cloud and Actions secrets from every command Claude runs.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Stop if the maintainer said stop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          AGENT_AUTOMATION: ${{ vars.AGENT_AUTOMATION }}
        run: |
          read -r state labels < <(gh api "repos/$REPO/issues/$ISSUE" --jq '"\(.state) \([.labels[].name] | join(","))"')
          if [ "${AGENT_AUTOMATION,,}" = off ] || [ "$state" != open ] || [[ ",$labels," == *",agent:stop,"* ]]; then
            echo "::error::Stopped: automation off, issue closed, or agent:stop label present."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pdftotext (for reading PDF sources)
        continue-on-error: true   # helpful for research, not required
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils > /dev/null

      - name: Prepare the prompt and limits
        id: prep
        env:
          STAGE: ${{ inputs.stage }}
          ROUND: ${{ inputs.round }}
          EDITS: ${{ inputs.edits_allowed }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.sha }}
          TASK_DIR: ${{ inputs.task_dir }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
          MODEL: ${{ vars.AGENT_CLAUDE_MODEL }}
          WORK_TURNS: ${{ vars.AGENT_CLAUDE_WORK_TURNS || '60' }}
          RESPOND_TURNS: ${{ vars.AGENT_CLAUDE_RESPOND_TURNS || '40' }}
          WORK_BUDGET: ${{ vars.AGENT_CLAUDE_WORK_BUDGET_USD || '5' }}
          RESPOND_BUDGET: ${{ vars.AGENT_CLAUDE_RESPOND_BUDGET_USD || '3' }}
        run: |
          if [ "$STAGE" = work ]; then turns=$WORK_TURNS; budget=$WORK_BUDGET; template=claude-work.md
          else turns=$RESPOND_TURNS; budget=$RESPOND_BUDGET; template=claude-respond.md; fi

          tools="Read,Glob,Grep,WebSearch,WebFetch,Bash(pdftotext:*),Bash(curl:*),Bash(ls:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
          if [ "$EDITS" = true ]; then tools="$tools,Write,Edit"; fi
          if [ "$EDITS" = true ] && [ "$MODE" = implement ]; then tools="$tools,Bash(python3:*)"; fi
          disallowed="Bash(git push:*),Bash(git commit:*),Bash(gh:*)"
          if [ "$EDITS" != true ]; then disallowed="$disallowed,Write,Edit"; fi

          python3 -I .github/agents/scripts/agent_task.py prompt \
            --template ".github/agents/prompts/$template" --out "$RUNNER_TEMP/prompt.md" \
            --set "repo=$REPO" --set "task_dir=$TASK_DIR" --set "branch=$BRANCH" --set "mode=$MODE" \
            --set "round=$ROUND" --set "sha=$SHA" --set "edits_allowed=$EDITS" \
            --set "max_turns=$turns" --set "budget_usd=$budget"
          schema=$(python3 -I -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(",", ":")))' \
            .github/agents/schemas/claude-result.schema.json)

          model_arg=""
          if [ -n "$MODEL" ]; then model_arg="--model $MODEL"; fi
          {
            echo "prompt<<__PROMPT_EOF__"; cat "$RUNNER_TEMP/prompt.md"; echo "__PROMPT_EOF__"
            echo "args<<__ARGS_EOF__"
            echo "--max-turns $turns"
            echo "--max-budget-usd $budget"
            echo "--allowedTools \"$tools\""
            echo "--disallowedTools \"$disallowed\""
            echo "--json-schema '$schema'"
            echo "$model_arg"
            echo "__ARGS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        id: claude
        continue-on-error: true   # still record what happened if a limit is hit
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1.0.262
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}   # read-only; also means the Claude GitHub App is not needed
          prompt: ${{ steps.prep.outputs.prompt }}
          claude_args: ${{ steps.prep.outputs.args }}

      - name: Package the result
        if: always() && steps.prep.outcome == 'success'
        env:
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          OUTCOME: ${{ steps.claude.outcome }}
          SHA: ${{ inputs.sha }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          printf '%s' "${STRUCTURED:-null}" > "$out/result.json"
          python3 -I .github/agents/scripts/agent_task.py usage --execution-file "$EXECUTION_FILE" --out "$out/usage.json"
          # Claude Code's own local settings folder is not part of the work.
          git add -A -- . ':(exclude).claude'
          git diff --cached --binary "$SHA" > "$out/changes.patch"
          git diff --cached --name-only "$SHA" > "$out/files.txt"
          printf '{"base_sha":"%s","outcome":"%s"}\n' "$SHA" "$OUTCOME" > "$out/meta.json"
          echo "Claude step: $OUTCOME"; echo "Files changed:"; cat "$out/files.txt"

      - uses: actions/upload-artifact@v4
        if: always() && steps.prep.outcome == 'success'
        with:
          name: claude-${{ inputs.stage }}-${{ inputs.round }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
