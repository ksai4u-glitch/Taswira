# Run the offline Python tests on every pull request and on main, so a broken
# build shows as a red check before anything is merged.
# No secrets: the tests never call the UCDP API (it is mocked).

name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        run: python -m unittest discover -s tests

      - name: History page checks (sources, dates, emblems; nothing written)
        run: python build_history.py --check
