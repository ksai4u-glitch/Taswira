# Runs one Codex review round of an agent task (called by agent-task.yml).
# Codex reads the exact commit it is given, cannot write files (read-only
# permission profile) and has no GitHub write access. Its JSON review leaves
# this workflow as an artifact; agent-publish.yml records and posts it.

name: Agent stage (Codex review)

on:
  workflow_call:
    inputs:
      round: { type: number, required: true }
      sha: { type: string, required: true }
      mode: { type: string, required: true }
      issue: { type: number, required: true }
      task_dir: { type: string, required: true }
      branch: { type: string, required: true }
    secrets:
      OPENAI_API_KEY: { required: true }

permissions: {}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: read
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Stop if the maintainer said stop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          AGENT_AUTOMATION: ${{ vars.AGENT_AUTOMATION }}
        run: |
          read -r state labels < <(gh api "repos/$REPO/issues/$ISSUE" --jq '"\(.state) \([.labels[].name] | join(","))"')
          if [ "${AGENT_AUTOMATION,,}" = off ] || [ "$state" != open ] || [[ ",$labels," == *",agent:stop,"* ]]; then
            echo "::error::Stopped: automation off, issue closed, or agent:stop label present."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the prompt
        env:
          ROUND: ${{ inputs.round }}
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.sha }}
          TASK_DIR: ${{ inputs.task_dir }}
          REPO: ${{ github.repository }}
        run: |
          read -r base_sha max_rounds < <(python3 -I -c 'import json,sys; t=json.load(open(sys.argv[1])); print(t["base_sha"], t["max_rounds"])' "$TASK_DIR/record/task.json")
          mkdir -p .agent-run
          python3 -I .github/agents/scripts/agent_task.py prompt \
            --template .github/agents/prompts/codex-review.md --out .agent-run/codex-prompt.md \
            --set "repo=$REPO" --set "task_dir=$TASK_DIR" --set "mode=$MODE" --set "round=$ROUND" \
            --set "max_rounds=$max_rounds" --set "sha=$SHA" --set "base_sha=$base_sha"

      # Last step of the job, as codex-action's security guide recommends.
      - name: Run Codex
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .agent-run/codex-prompt.md
          output-schema-file: .github/agents/schemas/codex-review.schema.json
          permission-profile: ":read-only"
          safety-strategy: drop-sudo
          codex-args: '["--search"]'
          model: ${{ vars.AGENT_CODEX_MODEL }}
          effort: ${{ vars.AGENT_CODEX_EFFORT }}

  save:
    # A fresh job, so nothing Codex left behind on the first runner is used.
    needs: review
    if: always() && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Save the review
        env:
          MESSAGE: ${{ needs.review.outputs.final_message }}
          RESULT: ${{ needs.review.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          printf '%s' "$MESSAGE" > "$RUNNER_TEMP/out/review.txt"
          printf '{"outcome":"%s"}\n' "$RESULT" > "$RUNNER_TEMP/out/meta.json"
          echo "Codex job: $RESULT ($(wc -c < "$RUNNER_TEMP/out/review.txt") bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: codex-review-${{ inputs.round }}
          path: ${{ runner.temp }}/out/
          retention-days: 30
