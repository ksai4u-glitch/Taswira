# Weekly check for a new monthly UCDP GED Candidate release.
# If there is one: add it to settings.py, download it, rebuild docs/index.html,
# and open a pull request with both. Nothing goes live until the maintainer
# merges it (merging is a normal push, so GitHub Pages then republishes the map).
# Needs a repository secret called UCDP_TOKEN (Settings -> Secrets and variables -> Actions)
# and "Allow GitHub Actions to create and approve pull requests" in Settings -> Actions.
# Policy: .github/agents/UPDATE-POLICY.md

name: Update map with new UCDP releases

on:
  schedule:
    - cron: "0 6 * * 1"     # every Monday at 06:00 UTC
  workflow_dispatch:         # plus a "Run workflow" button in the Actions tab

permissions: {}               # nothing by default; the job below asks for what it needs

concurrency:
  group: ucdp-update
  cancel-in-progress: false  # never cut a running update short; the next one waits

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # a stuck download must not hold the runner for 6 hours
    permissions:
      contents: write        # to push the data/ged-... branch (never main)
      pull-requests: write   # to list and open pull requests
    defaults:
      run:
        # bash with pipefail: a failing "python publish.py | tee ..." must fail the step
        shell: bash
    steps:
      # The git credentials are not left in .git/config while the Python steps run;
      # only the final step gets a token to push with.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The database is not in git (data/ is ignored), so keep it between runs in
      # the Actions cache. Weekly runs keep the cache from expiring. If it is ever
      # lost, save_events.py simply downloads everything again (a few hundred requests).
      - name: Restore saved events
        uses: actions/cache/restore@v4
        with:
          path: data/taswira.db
          key: taswira-db-${{ github.run_id }}
          restore-keys: taswira-db-

      # Fast, offline tests of the update scripts (API mocked, no token).
      - name: Test the update scripts
        run: python -m unittest discover -s tests -p "test_update_*.py"

      - name: Check for a new Candidate release (1 request)
        id: check
        env:
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}
        run: python update_candidates.py

      # One data pull request at a time. Until it is merged, settings.py on main
      # does not list the new version, so every weekly run would find it again.
      - name: Skip if a data pull request is already waiting
        id: open
        if: steps.check.outputs.new_versions != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only branches in this repository count: a pull request from a fork that
          # happens to use a data/ged-... branch name must not pause the updates.
          waiting=$(gh pr list --state open --limit 100 --json headRefName,isCrossRepository,url \
            --jq '[.[] | select((.headRefName | startswith("data/ged-")) and (.isCrossRepository | not)) | .url] | first // ""')
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          if [ -n "$waiting" ]; then echo "Waiting for $waiting to be merged or closed; nothing to do."; fi

      - name: Download, clean and rebuild the public page
        if: steps.check.outputs.new_versions != '' && steps.open.outputs.waiting == ''
        env:
          UCDP_TOKEN: ${{ secrets.UCDP_TOKEN }}   # publish.py checks the page does not contain it
        run: |
          python save_events.py
          python clean_events.py
          python publish.py | tee publish.log

      - name: Save events for next time
        if: steps.check.outputs.new_versions != '' && steps.open.outputs.waiting == ''
        uses: actions/cache/save@v4
        with:
          path: data/taswira.db
          key: taswira-db-${{ github.run_id }}

      - name: Open a pull request for review
        if: steps.check.outputs.new_versions != '' && steps.open.outputs.waiting == ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSIONS: ${{ steps.check.outputs.new_versions }}
          BASE: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          # Only these two files may change; anything else means something is wrong.
          unexpected=$(git status --porcelain --untracked-files=no | awk '{print $2}' \
                       | grep -vxE 'settings\.py|docs/index\.html' || true)
          if [ -n "$unexpected" ]; then echo "Unexpected changes: $unexpected"; exit 1; fi

          branch="data/ged-${NEW_VERSIONS// /-}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add settings.py docs/index.html
          git commit -m "Add GED Candidate $NEW_VERSIONS"
          gh auth setup-git          # push with GH_TOKEN (checkout did not keep credentials)
          git push --force origin "HEAD:refs/heads/$branch"   # a data/ branch only this workflow writes

          {
            echo "UCDP published GED Candidate **$NEW_VERSIONS** (preliminary data)."
            echo
            echo "This adds it to \`CANDIDATE_VERSIONS\` in \`settings.py\` and rebuilds \`docs/index.html\`."
            echo "**Merging publishes it on the live map.** Closing it skips it for now (next Monday's run will offer it again)."
            echo
            echo "publish.py output:"
            echo '```'
            cat publish.log
            echo '```'
          } > pr-body.md
          gh pr create --base "$BASE" --head "$branch" \
            --title "Add GED Candidate $NEW_VERSIONS" --body-file pr-body.md
